packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# pnpm 11.25 exige booleanos explicitos aqui; el placeholder que dejo pnpm al
# escribir este bloque no era valido y hacia que se ignorasen los builds.
allowBuilds:
  esbuild: true
  protobufjs: true
  # sharp trae binarios nativos por plataforma; sin su postinstall, media-service
  # no puede generar miniaturas.
  sharp: true

# Solo estas dependencias pueden ejecutar scripts de instalacion (postinstall).
# Es una medida contra ataques de cadena de suministro: un paquete transitivo
# comprometido no puede ejecutar codigo arbitrario en la maquina al instalar.
onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - argon2
  - bcrypt
  - "@nestjs/core"
  - sharp
